<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Green-Trace UAE — Leaf Identification & Health AI</title>
<meta name="description" content="Identify Ghaf, Sidr, Date Palm and Samar trees from a single leaf, and measure that leaf's health — entirely on your device. A UAE graduation project.">
<meta name="theme-color" content="#fbf6ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Green-Trace">
<meta property="og:title" content="Green-Trace UAE">
<meta property="og:description" content="AI leaf identification and health diagnosis for four native UAE trees.">
<meta property="og:type" content="website">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/icons/icon-180.png">
<link rel="stylesheet" href="./css/app.css">
<link rel="stylesheet" href="./css/anim.css">
<!-- Fonts are progressive enhancement; the system stack renders identically offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
</head>
<body>

<header class="topbar">
  <a class="brand" href="#/scan" aria-label="Green-Trace UAE, home">
    <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <path d="M16 29V13" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M16 17c0-6 4-11 11-12 1 7-3 13-11 13Z" fill="var(--accent)"/>
      <path d="M15 21c0-5-3.5-9-9-9.8C5.2 17 8.6 21.6 15 21Z" fill="currentColor" opacity=".45"/>
    </svg>
    <span data-i18n="app.name">Green-Trace UAE<small data-i18n="app.tag">UAE Leaf Identification &amp; Health AI</small></span>
  </a>
  <div class="spacer"></div>
  <button class="iconbtn" id="btn-lang" aria-label="Language">
    <span id="lang-label">ع</span>
  </button>
  <button class="iconbtn" id="btn-theme" aria-label="Appearance settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" stroke-linecap="round"/>
    </svg>
  </button>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabbar" aria-label="Main">
  <a href="#/scan" data-tab="scan">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
      <path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3" stroke-linecap="round"/>
      <circle cx="12" cy="12" r="3.4"/>
    </svg>
    <span data-i18n="nav.scan">Scan</span>
  </a>
  <a href="#/library" data-tab="library">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
      <path d="M11 20V11M11 13C11 7 15 3 21 3c0 7-4 10-10 10Z" stroke-linejoin="round"/>
      <path d="M10 16c0-4-2.6-6.6-6.5-7 0 4 2.2 7 6.5 7Z" stroke-linejoin="round"/>
    </svg>
    <span data-i18n="nav.library">Trees</span>
  </a>
  <a href="#/about" data-tab="about">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/><path d="M12 11v5" stroke-linecap="round"/><circle cx="12" cy="7.8" r="1.1" fill="currentColor" stroke="none"/>
    </svg>
    <span data-i18n="nav.about">About</span>
  </a>
  <a href="#/team" data-tab="team">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
      <circle cx="9" cy="8" r="3.2"/><path d="M2.6 20a6.6 6.6 0 0 1 12.8 0" stroke-linecap="round"/>
      <path d="M16.5 5.3a3.2 3.2 0 0 1 0 5.4M18 14.4A6.6 6.6 0 0 1 21.4 20" stroke-linecap="round"/>
    </svg>
    <span data-i18n="nav.team">Made By</span>
  </a>
</nav>

<dialog class="sheet" id="sheet">
  <div class="sheet-body">
    <h2 data-i18n="settings.title">Appearance</h2>
    <h3 data-i18n="settings.theme">Theme</h3>
    <div class="theme-list" id="theme-list" role="radiogroup" aria-label="Theme"></div>
    <h3 data-i18n="settings.language">Language</h3>
    <div class="seg" id="lang-seg">
      <button data-lang="en" type="button">English</button>
      <button data-lang="ar" type="button">العربية</button>
    </div>
    <h3 style="margin-top:20px" data-i18n="settings.motion">Animation</h3>
    <div class="seg" id="motion-seg">
      <button data-motion="auto" type="button" data-i18n="motion.auto">Auto</button>
      <button data-motion="on" type="button" data-i18n="motion.on">Full</button>
      <button data-motion="off" type="button" data-i18n="motion.off">Off</button>
    </div>
    <p class="faint" style="margin:8px 0 0" data-i18n="settings.motionHint">Auto follows your device's reduced-motion setting.</p>
    <button class="btn wide" id="sheet-close" style="margin-top:18px" data-i18n="settings.close">Done</button>
  </div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>
<p class="sr" id="live" aria-live="polite"></p>

<script src="./vendor/tf.min.js"></script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
